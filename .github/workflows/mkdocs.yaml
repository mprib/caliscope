name: mkdocs
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # git-revision-date-localized reads commit history; a shallow clone
          # makes it warn, which --strict would treat as a failure.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
          python-version: "3.12"
      - run: uv run --locked --only-group docs mkdocs build --strict

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
          python-version: "3.12"
      - uses: actions/cache@v6
        with:
          key: ${{ github.ref }}
          path: .cache
      - run: uv run --locked --only-group docs mkdocs gh-deploy --force
